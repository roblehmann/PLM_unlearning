[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plm_unlearning"
version = "0.1.0"
description = "Measurement harness for second-line (functional-mapping) safeguards on protein sequence models; task blocking as the first instance."
requires-python = ">=3.10"
# Runtime deps are pinned in environment.yml; listed here so `pip install -e .` is self-sufficient.
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "biopython>=1.81",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs a GPU and/or large downloads; deselect with -m 'not slow'",
    "needs_net: hits external services (Pfam/InterPro/HuggingFace)",
    "needs_tools: needs mmseqs2 / hmmer on PATH",
]
